# Copy this file to .ax/mcp.toml, or pass --mcp-config <path>.
#
# `description` and `capabilities` are shown to the model through the
# always-on MCP capability catalog *without* connecting to the server, so
# the model can discover what a sleeping/disabled server offers before
# spending a real connection on `list_tools`/`call`.

[servers.local-files]
transport = "stdio"
command = "your-mcp-server"
args = ["--stdio"]
description = "Local filesystem indexer and search"
capabilities = ["search", "read"]
protocol_version = "2026-07-28"
request_timeout_secs = 30

[servers.remote]
transport = "http"
url = "https://example.com/mcp"
headers = { Authorization = "Bearer replace-me" }
description = "Project issue tracker"
capabilities = ["issues", "tasks"]
enabled = false

# Supply an installed MCP server that exposes LSP operations, then enable it.
[servers.lsp]
transport = "stdio"
command = "your-lsp-mcp-server"
args = ["--your-server-options"]
description = "Language-server code intelligence for this project"
capabilities = ["lsp", "definitions", "references", "diagnostics"]
request_timeout_secs = 300
enabled = false

[servers.custom-websocket]
transport = "websocket"
url = "wss://example.com/mcp"
description = "Realtime collaboration events"
capabilities = ["events"]
enabled = false
