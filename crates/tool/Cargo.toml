[package]
name = "tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sandbox = { path = "../sandbox" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
html2md = "0.2"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
tower = "0.5"
base64 = "0.22"
uuid.workspace = true
# AX-owned discovery/search engine. `ignore` is the ripgrep traversal crate and
# `globset` its glob engine, so AX never shells out to a user-installed `rg`.
ignore = "0.4"
globset = "0.4"
regex = "1"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "pattern"] }
win-screenshot = "4.0.14"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

# Opts out of the workspace lint table instead of inheriting it: decoding
# Windows console output (`src/shell.rs::native_decode`) needs
# `MultiByteToWideChar`, and the dependency tree has no safe binding for it, so
# this crate cannot keep `unsafe_code = "forbid"`. That FFI is the only `unsafe`
# here, and it is confined to one `#[cfg(windows)]` function; every other lint
# below mirrors the workspace.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "search_router"
path = "../../test/web/search_router.rs"

[[test]]
name = "ssh"
path = "../../test/ssh.rs"

[[test]]
name = "desktop"
path = "../../test/desktop.rs"

[[test]]
name = "host_permissions"
path = "../../test/host_permissions.rs"

[[test]]
name = "host_browser"
path = "../../test/host_browser.rs"
