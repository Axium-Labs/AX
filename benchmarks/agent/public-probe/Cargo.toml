[package]
name = "ax-bench-sandbox-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sandbox = { path = "../../../crates/sandbox" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
