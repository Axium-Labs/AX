name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: ax-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: ax-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            asset: ax-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: ax-aarch64-unknown-linux-musl.tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            asset: ax-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            asset: ax-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          GITCODE_AX_REPOSITORY: ${{ vars.GITCODE_AX_REPOSITORY }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The archive carries the binary plus the bundled skills and the MCP
          # example so the installer can place them in AX_HOME.
          $package = Join-Path $env:RUNNER_TEMP "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ax.exe" $package
          Copy-Item "skills" $package -Recurse
          Copy-Item "mcp.example.toml" $package
          Compress-Archive -Path "$package/*" -DestinationPath "$env:RUNNER_TEMP/${{ matrix.asset }}" -Force

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/ax" "$package/"
          cp -R skills "$package/"
          cp mcp.example.toml "$package/"
          tar -czf "$RUNNER_TEMP/${{ matrix.asset }}" -C "$package" .

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ax-release-${{ matrix.target }}
          path: "${{ runner.temp }}/${{ matrix.asset }}"
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release notes
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: ax-release-*
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum ax-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/ax-*
            assets/SHA256SUMS
          generate_release_notes: true
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
