name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: ax-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          GITCODE_AX_REPOSITORY: ${{ vars.GITCODE_AX_REPOSITORY }}
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The archive carries the binary plus the bundled skills and the MCP
          # example so the installer can place them in AX_HOME.
          $package = Join-Path $env:RUNNER_TEMP "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ax.exe" $package
          Copy-Item "skills" $package -Recurse
          Copy-Item "mcp.example.toml" $package
          Compress-Archive -Path "$package/*" -DestinationPath "$env:RUNNER_TEMP/${{ matrix.asset }}" -Force

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ax-release-${{ matrix.target }}
          path: "${{ runner.temp }}/${{ matrix.asset }}"
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: ax-release-*
          path: assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum ax-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/ax-*
            assets/SHA256SUMS
          generate_release_notes: true
